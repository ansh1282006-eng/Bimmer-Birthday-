<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Bimmer ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#050505;
overflow-x:hidden;
color:white;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{

width:380px;
max-width:95%;

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

border-radius:25px;

padding:25px;

text-align:center;

box-shadow:0 0 35px rgba(255,20,147,.35);

animation:fade 1.5s;

}

.card img{

width:100%;

border-radius:20px;

margin-bottom:20px;

}

h1{

font-size:35px;

color:#ff66b3;

}

p{

margin:18px 0;

line-height:1.8;

color:#f4d7e6;

}

button{

padding:14px 35px;

border:none;

border-radius:40px;

background:#ff2d75;

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.08);

}

@keyframes fade{

from{opacity:0;transform:translateY(40px);}

to{opacity:1;transform:translateY(0);}

}

.heart{

position:fixed;

top:-50px;

font-size:24px;

animation:fall linear infinite;

}

@keyframes fall{

to{

transform:translateY(110vh);

}

}

</style>

</head>

<body>

<section class="hero">

<div class="card">

<img src="photo1.jpg">

<h1>Happy Birthday Bimmer ❤️</h1>

<p>

Today is your special day.

I made this little surprise only for you.

I hope it brings a smile to your beautiful face.

</p>

<button onclick="nextPage()">

Begin Your Surprise ❤️

</button>

</div>

</section>

<script>

function nextPage(){

alert("Part 2 me Cake Cutting khulega ❤️");

}

for(let i=0;i<35;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="💖";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(4+Math.random()*5)+"s";

h.style.fontSize=(20+Math.random()*18)+"px";

document.body.appendChild(h);

}/* ---------- Cake Section ---------- */

document.body.innerHTML += `

<section id="cake" style="display:none;text-align:center;padding:60px 20px;">

<h1 style="color:#ff66b3;">🎂 Time To Cut The Cake 🎂</h1>

<div style="font-size:140px;margin-top:20px;">🎂</div>

<p style="margin:20px;font-size:20px;">
Make a wish and cut your birthday cake ❤️
</p>

<button onclick="cutCake()">
Cut The Cake 🎉
</button>

<div id="cakeMsg"
style="display:none;margin-top:30px;font-size:26px;color:#ffd6ea;">
🎉 Happy Birthday Bimmer ❤️ 🎉
</div>

</section>

`;

function nextPage(){

document.querySelector(".hero").style.display="none";

document.getElementById("cake").style.display="block";

}

function cutCake(){

document.getElementById("cakeMsg").style.display="block";

fireworks();

setTimeout(()=>{
showLetter();
},2500);

}

function fireworks(){

for(let i=0;i<120;i++){

let c=document.createElement("div");

c.innerHTML="🎉";

c.style.position="fixed";

c.style.left=Math.random()*100+"vw";

c.style.top=Math.random()*100+"vh";

c.style.fontSize=(20+Math.random()*30)+"px";

document.body.appendChild(c);

setTimeout(()=>{

c.remove();

},3000);

}

}/* -------- Love Letter -------- */

function showLetter(){

document.body.innerHTML += `

<section style="padding:60px 20px;text-align:center;animation:fade 1s;">

<h1 style="color:#ff66b3;">💌 A Letter For You 💌</h1>

<p style="max-width:700px;margin:30px auto;font-size:20px;line-height:1.9;">

Dear Bimmer ❤️<br><br>

Happy Birthday to the most beautiful person in my life.

Thank you for bringing happiness, peace and love into my world.

I wish every dream of yours comes true.

May your smile never fade.

No matter what happens, I'll always pray for your happiness.

You mean more to me than words can ever describe.

Happy Birthday once again, My Love.

❤️ I Love You Forever ❤️

</p>

<button onclick="showGallery()">
Our Memories 📸
</button>

</section>

`;

}

/* -------- Gallery -------- */

function showGallery(){

document.body.innerHTML += `

<section style="padding:40px;text-align:center;">

<h1 style="color:#ff66b3;">📸 Our Beautiful Memories</h1>

<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:15px;margin-top:30px;">

<img src="photo1.jpg" width="220">
<img src="photo2.jpg" width="220">
<img src="photo3.jpg" width="220">
<img src="photo4.jpg" width="220">
<img src="photo5.jpg" width="220">

</div>

<br><br>

<button onclick="finalSurprise()">
One Last Surprise ❤️
</button>

</section>

`;

}

/* -------- Final Surprise -------- */

function finalSurprise(){

document.body.innerHTML = `

<div style="height:100vh;background:#000;color:white;display:flex;justify-content:center;align-items:center;text-align:center;padding:20px;">

<div>

<h1 style="font-size:50px;color:#ff4da6;">

❤️ Happy Birthday Bimmer ❤️

</h1>

<p style="font-size:24px;line-height:1.8;margin-top:20px;">

No matter where life takes us...

You'll always have a special place in my heart.

Thank you for being part of my life.

❤️ I Love You Forever ❤️

</p>

<div style="font-size:70px;margin-top:30px;">
🎂💖🎉🌹🎁
</div>

</div>

</div>

`;

}

</script>

</body>
</html>
